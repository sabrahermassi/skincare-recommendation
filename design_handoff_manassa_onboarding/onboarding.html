<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manassa — Onboarding screen (design reference)</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#EFE7E1;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px}
  a{color:#9B665B}a:hover{color:#5A342C}
  /* Presentation only — do NOT port. Port the contents of .screen. */
  .device{width:375px;height:812px;border-radius:44px;overflow:hidden;box-shadow:0 22px 64px rgba(90,52,44,.18);flex:none}
</style>
</head>
<body>
<div class="device">
  <div class="screen" style="width:375px;height:812px;box-sizing:border-box;display:flex;flex-direction:column;background:#FBF4EE;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;color:#5A342C;position:relative;overflow:hidden">

    <!-- elastic spacer A : weight 1 -->
    <div style="flex:1;min-height:20px"></div>

    <!-- 1 · hero -->
    <div style="display:flex;justify-content:center;padding:0 24px">
      <img src="assets/illustration-22.png" alt="" style="width:100%;max-width:300px;height:auto;display:block">
    </div>

    <!-- 2 · wordmark + tagline -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 24px 0">
      <div style="font-family:'Playfair Display',Georgia,serif;font-size:40px;font-weight:500;line-height:1;letter-spacing:-.018em;color:#5A342C">Manassa</div>
      <div style="font-size:15px;font-weight:400;line-height:1.5;color:#9B665B;text-align:center;text-wrap:pretty">Find your skin&rsquo;s perfect match</div>
    </div>

    <!-- FIXED 54px gap — pairs the identity block with the feature row -->
    <div style="height:54px;flex:none"></div>

    <!-- 3 · three-icon row -->
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:0 24px">
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0">
        <div style="height:72px;width:100%;display:flex;align-items:flex-end;justify-content:center">
          <img src="assets/illustration-25.png" alt="" style="max-width:100%;max-height:72px;width:auto;height:auto;object-fit:contain;display:block">
        </div>
        <div style="font-size:12px;font-weight:600;letter-spacing:-.004em;color:#5A342C;text-align:center">Scan</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0">
        <div style="height:72px;width:100%;display:flex;align-items:flex-end;justify-content:center">
          <img src="assets/illustration-40.png" alt="" style="max-width:100%;max-height:72px;width:auto;height:auto;object-fit:contain;display:block">
        </div>
        <div style="font-size:12px;font-weight:600;letter-spacing:-.004em;color:#5A342C;text-align:center">Analyze</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0">
        <div style="height:72px;width:100%;display:flex;align-items:flex-end;justify-content:center">
          <img src="assets/illustration-30.png" alt="" style="max-width:100%;max-height:72px;width:auto;height:auto;object-fit:contain;display:block">
        </div>
        <div style="font-size:12px;font-weight:600;letter-spacing:-.004em;color:#5A342C;text-align:center">Know</div>
      </div>
    </div>

    <!-- elastic spacer B : weight 1.4 -->
    <div style="flex:1.4;min-height:28px"></div>

    <!-- 4 · actions -->
    <div style="display:flex;flex-direction:column;gap:4px;padding:0 24px 32px">
      <div role="button" tabindex="0" style="padding:15px 20px;border-radius:26px;background:#F2BFA6;min-height:50px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;color:#5A342C;cursor:pointer">Scan my first product</div>
      <div role="button" tabindex="0" style="min-height:44px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:500;color:#9B665B;cursor:pointer">Set up my skin profile first</div>
    </div>

  </div>
</div>
</body>
</html>
