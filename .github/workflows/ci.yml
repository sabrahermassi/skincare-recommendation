name: CI

# Issue #17: `npm test` has run locally throughout this project's history —
# 240+ tests as of writing — but nothing enforced it. A broken test, a type
# error, or a lint violation could merge with nothing stopping it. This
# closes exactly that gap: typecheck, lint and the full test suite, required
# to pass on every PR.
#
# Added 18 September 2026: a `migrations` job. Until then CI could not see a
# `.sql` file at all — `npm test` covers TypeScript and nothing applied a
# migration anywhere, so a syntax error or a broken grant surfaced for the
# first time at `supabase db push` against production. That is the worst place
# to find one, and this project has already been bitten by migrations silently
# never reaching production (0008 through 0015, discovered weeks later).
#
# Deliberately not doing here: the three-platform `expo export` bundling
# check. That's already covered by secret-scan.yml, which exports every
# platform on the same triggers — a broken bundle already fails CI today via
# that workflow, so duplicating the export here would only double the cost
# for no new coverage.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # A throwaway Postgres, every migration applied in order, then assertions
  # against the behaviour they are supposed to produce. No Supabase CLI and no
  # Docker image beyond the service container: `psql` is enough, and `psql`
  # with ON_ERROR_STOP exits non-zero on a failed `assert`, which is all a CI
  # step needs.
  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # Supabase creates these; a stock Postgres does not, and the grants in
      # several migrations name them. Without this the migrations fail for a
      # reason that has nothing to do with whether they are correct.
      - name: Create the Supabase roles
        run: |
          for role in anon authenticated service_role; do
            psql -v ON_ERROR_STOP=1 -c "create role $role;"
          done

      # `pg_cron` is a Supabase extension and cannot be installed here. Stubbing
      # `cron.schedule` lets the scheduling lines run verbatim rather than being
      # stripped, so a typo in one still fails the build. What it cannot check
      # is that the job ever *fires* — migration 0002's own comment is the
      # precedent for treating that as a thing to confirm in the dashboard.
      - name: Stub pg_cron
        run: |
          psql -v ON_ERROR_STOP=1 -c "create schema cron;"
          psql -v ON_ERROR_STOP=1 -c "create function cron.schedule(text,text,text) returns bigint language sql as 'select 1::bigint';"

      - name: Apply every migration, in order
        run: |
          for f in supabase/migrations/*.sql; do
            echo "── $f"
            grep -v '^create extension if not exists pg_cron;$' "$f" > /tmp/m.sql
            psql -v ON_ERROR_STOP=1 -f /tmp/m.sql
          done

      - name: Run the SQL tests
        run: |
          for f in supabase/tests/*.test.sql; do
            echo "── $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      # The property the whole design rests on, and the one a single session
      # cannot observe: `on conflict do update ... returning` makes the
      # increment and the answer one operation, so N concurrent callers get N
      # distinct counts rather than all reading the same under-the-limit value.
      # Asserted with real parallel clients because there is no other way to
      # see it.
      - name: Concurrent callers get distinct counts
        run: |
          psql -v ON_ERROR_STOP=1 -c "delete from rate_limits;"
          for i in $(seq 30); do
            psql -tAq -c "select consume_rate_limit('ci-concurrent','caller',600,5);" &
          done
          wait > /dev/null 2>&1
          allowed=$(psql -tAq -c "select count(*) from rate_limits where bucket='ci-concurrent';")
          total=$(psql -tAq -c "select coalesce(sum(count),0) from rate_limits where bucket='ci-concurrent';")
          echo "rows=$allowed total=$total"
          test "$allowed" = "1" || { echo "expected exactly one row, got $allowed"; exit 1; }
          test "$total" = "30" || { echo "expected 30 counted requests, got $total"; exit 1; }
