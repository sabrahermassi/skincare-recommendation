name: Secret scan

# Issue #15: Expo inlines any EXPO_PUBLIC_* variable straight into the
# shipped JS bundle, and app.json's web.output: "single" makes that bundle a
# static file anyone can download. This builds every platform's bundle
# exactly the way a release would and fails the build the moment a
# server-only secret's name or a recognisable key value shows up in it.
#
# Runs with no repository secrets configured or needed: the real
# SUPABASE_SERVICE_ROLE_KEY / INCI_API_KEY / GOOGLE_VISION_API_KEY live only
# in the Supabase Edge Function environment and are never read by this build
# at all — this check works by their NAMES and by known key-value shapes,
# not by comparing against the real values, so nothing sensitive needs to be
# duplicated into GitHub Actions to run it.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # No .env is present in CI, on purpose: this proves the check works
      # against exactly what a contributor's own fresh checkout would
      # produce (CLAUDE.md: "a fresh checkout works with no setup"), not
      # against a build seeded with this maintainer's own real values.
      - name: Export every platform
        run: >
          npx expo export
          --platform web --platform ios --platform android
          --output-dir dist

      - name: Check exported bundles for leaked secrets
        run: node scripts/check-bundle-secrets.mjs dist
