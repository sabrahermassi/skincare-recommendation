name: Claude

# Lets anyone with write access summon Claude from a comment: write
# "@claude review this PR" (or any other request) on an issue or pull
# request and this workflow answers in a reply on the same thread.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Keeps a runner from starting on every comment in the repo. The action
    # checks the trigger phrase again itself.
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # Required by the action's default GitHub App authentication.
      id-token: write
      # Lets Claude read this repo's CI results when asked about a failure.
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Applies to review requests only, so "@claude review this PR" on its
          # own gets the terse shape without the instructions being retyped
          # every time. Any other request — fix this, explain that — is
          # untouched and still answers normally.
          claude_args: |
            --append-system-prompt "When asked to review a pull request: report only defects — bugs, broken edge cases, security problems, tests that do not exercise what they claim. Post each one as an inline comment on the line it concerns. Do not write a summary report, do not list what is correct, do not restate what the code does, do not suggest refactors or stylistic changes. Find nothing, reply 'No issues found.' and stop. This governs reviews only; answer every other request normally."
