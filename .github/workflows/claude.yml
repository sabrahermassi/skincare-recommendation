name: Claude

# Lets anyone with write access summon Claude from a comment: write
# "@claude review this PR" (or any other request) on an issue or pull
# request and this workflow answers in a reply on the same thread.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Keeps a runner from starting on every comment in the repo. The action
    # checks the trigger phrase again itself.
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # Required by the action's default GitHub App authentication.
      id-token: write
      # Lets Claude read this repo's CI results when asked about a failure.
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history rather than the latest commit: a review reads the diff
          # against the base branch, which a shallow clone cannot produce.
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Points a bare "@claude review this PR" at a written contract, so
          # the shape does not have to be retyped into every mention. Reviews
          # stay manual — nothing here runs on its own. Any other request —
          # fix this, explain that — is untouched and answers normally.
          claude_args: |
            --append-system-prompt "When asked to review a pull request, follow .claude/skills/pr-review/SKILL.md exactly. It governs reviews only; answer every other request normally."
