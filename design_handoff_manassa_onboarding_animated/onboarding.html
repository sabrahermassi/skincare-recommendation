<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manassa — Onboarding screen (design reference)</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#EFE7E1;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:100vh;padding:40px;box-sizing:border-box}
  a{color:#9B665B}a:hover{color:#5A342C}
  /* Presentation only — do NOT port. Port the contents of .screen. */
  .device{width:375px;height:812px;border-radius:44px;overflow:hidden;box-shadow:0 22px 64px rgba(90,52,44,.18);flex:none}
  .replay{min-width:200px;min-height:40px;border-radius:20px;background:#FCF8F5;border:1px solid #E4D3C8;display:flex;align-items:center;justify-content:center;gap:8px;font-family:ui-monospace,Menlo,monospace;font-size:10px;font-weight:600;letter-spacing:.09em;color:#5A342C;cursor:pointer}
  .replay:hover{background:#F6E7DC}

/* ─── PORT EVERYTHING BELOW THIS LINE ─────────────────────────── */
@keyframes kn-tick{0%,68%,100%{transform:scale(1) translateY(0)}16%{transform:scale(1.5) translateY(-2.5%)}32%{transform:scale(.9) translateY(0)}46%{transform:scale(1.18) translateY(-1%)}}
@keyframes kn-spark{0%,100%{opacity:1;transform:scale(1) rotate(0deg)}30%{opacity:0;transform:scale(.4) rotate(-45deg)}62%{opacity:1;transform:scale(1.35) rotate(20deg)}}
@keyframes an-lens{0%,100%{transform:translate(0,0)}25%{transform:translate(-4.2%,-2.9%)}50%{transform:translate(-8.4%,0)}75%{transform:translate(-4.2%,2.9%)}}
@keyframes sc-sweep{0%,100%{top:21%}50%{top:39%}}
@keyframes hr-arm{0%,50%,100%{transform:rotate(0deg)}25%{transform:rotate(2.3deg)}75%{transform:rotate(-2.3deg)}}
@keyframes hr-spark{0%,100%{opacity:1}42%{opacity:.08}}
@keyframes hr-lean{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-2deg)}}
@keyframes en-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes sc-spark{0%,100%{opacity:1;transform:scale(1)}38%{opacity:.05;transform:scale(.55)}}
@media (prefers-reduced-motion: no-preference){
[data-kn="tick"]{animation:kn-tick 2.4s ease-in-out var(--amb,0s) infinite}
[data-kn="spark"]{animation:kn-spark 3.7s ease-in-out calc(var(--amb,0s) + .7s) infinite}
[data-an="lens"]{animation:an-lens 7.5s linear var(--amb,0s) infinite}
[data-sc="sweep"]{animation:sc-sweep 4.5s ease-in-out var(--amb,0s) infinite}
[data-hr="arm"]{animation:hr-arm 6.4s ease-in-out var(--amb,0s) infinite}
[data-hr="spark"]{animation:hr-spark 8.1s ease-in-out calc(var(--amb,0s) + 1.1s) infinite}
[data-hr="lean"]{animation:hr-lean 9s ease-in-out var(--amb,0s) infinite}
[data-sc="spark"]{animation:sc-spark 6.2s ease-in-out calc(var(--amb,0s) + 1.4s) infinite}
.intro{--amb:1.3s}
.intro [data-en]{animation:en-rise .4s ease-out both}
.intro [data-en="hero"]{animation-delay:0s}
.intro [data-en="name"]{animation-delay:.25s}
.intro [data-en="tag"]{animation-delay:.35s}
.intro [data-en="i1"]{animation-delay:.5s}
.intro [data-en="i2"]{animation-delay:.58s}
.intro [data-en="i3"]{animation-delay:.66s}
.intro [data-en="btn"]{animation-delay:.8s}
.intro [data-en="link"]{animation-delay:.9s}
}

/* ─── END PORTABLE BLOCK ──────────────────────────────────────── */
</style>
</head>
<body>
<div class="replay" onclick="replay()">REPLAY ENTRANCE</div>
<div class="device">
<div class="screen" id="screen" style="width:375px;height:812px;box-sizing:border-box;display:flex;flex-direction:column;background:#FBF4EE;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;color:#5A342C;position:relative;overflow:hidden">

        <div style="flex:1;min-height:20px;position:relative"></div>

        <div data-en="hero" style="display:flex;justify-content:center;padding:0 24px;position:relative">
          <div data-hr="lean" style="position:relative;width:100%;max-width:300px;aspect-ratio:637 / 541;transform-origin:50% 96%">
            <img src="assets/hero-base.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;display:block">
            <img src="assets/hero-arm.png" alt="" data-hr="arm" style="position:absolute;inset:0;width:100%;height:100%;display:block;transform-origin:67.5% 98%">
            <img src="assets/hero-sparkles.png" alt="" data-hr="spark" style="position:absolute;inset:0;width:100%;height:100%;display:block">
          </div>
        </div>

        <div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 24px 0;position:relative">
          <div data-en="name" style="font-family:'Playfair Display',Georgia,serif;font-size:40px;font-weight:500;line-height:1;letter-spacing:-.018em;color:#5A342C">Manassa</div>
          <div data-en="tag" style="font-size:15px;font-weight:400;line-height:1.5;color:#9B665B;text-align:center;text-wrap:pretty">Find your skin's perfect match</div>
        </div>

        <div style="height:54px;flex:none"></div>

        <div style="display:flex;justify-content:space-between;align-items:flex-start;padding:0 24px;position:relative">
          <div data-en="i1" style="display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0">
            <div style="height:84px;width:100%;display:flex;align-items:center;justify-content:center">
              <div style="position:relative;width:98.5px;height:82.4px;flex:none">
                <img src="assets/scan-base.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;display:block">
                <img src="assets/scan-barcode.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;display:block">
                <div data-sc="sweep" style="position:absolute;left:40%;right:35.5%;top:21%;height:8%;border-radius:50%;background:linear-gradient(to bottom, rgba(242,191,166,0) 0%, rgba(242,191,166,.85) 50%, rgba(242,191,166,0) 100%);transform:rotate(10deg);filter:blur(1.4px);pointer-events:none"></div>
                <img src="assets/scan-sparkle.png" alt="" data-sc="spark" style="position:absolute;inset:0;width:100%;height:100%;display:block;transform-origin:78.2% 8.9%">
              </div>
            </div>
            <div style="font-size:12px;font-weight:600;letter-spacing:-.004em;color:#5A342C;text-align:center">Scan</div>
          </div>
          <div data-en="i2" style="display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0">
            <div style="height:84px;width:100%;display:flex;align-items:center;justify-content:center">
              <div style="position:relative;width:78px;height:70.9px;flex:none">
                <img src="assets/analyze-paper.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;display:block">
                <img src="assets/analyze-magnifier.png" alt="" data-an="lens" style="position:absolute;inset:0;width:100%;height:100%;display:block">
              </div>
            </div>
            <div style="font-size:12px;font-weight:600;letter-spacing:-.004em;color:#5A342C;text-align:center">Analyze</div>
          </div>
          <div data-en="i3" style="display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0">
            <div style="height:84px;width:100%;display:flex;align-items:center;justify-content:center">
              <div style="position:relative;width:56px;height:58.7px;flex:none">
                <img src="assets/know-base.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;display:block">
                <img src="assets/know-checkmark.png" alt="" data-kn="tick" style="position:absolute;inset:0;width:100%;height:100%;display:block;transform-origin:50.1% 47.6%">
                <img src="assets/know-sparkle.png" alt="" data-kn="spark" style="position:absolute;inset:0;width:100%;height:100%;display:block;transform-origin:87.3% 15%">
              </div>
            </div>
            <div style="font-size:12px;font-weight:600;letter-spacing:-.004em;color:#5A342C;text-align:center">Know</div>
          </div>
        </div>

        <div style="flex:1.4;min-height:28px;position:relative"></div>

        <div style="display:flex;flex-direction:column;gap:4px;padding:0 24px 32px;position:relative">
          <div data-en="btn" style="padding:15px 20px;border-radius:26px;background:#F2BFA6;min-height:50px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;color:#5A342C;cursor:pointer">Scan my first product</div>
          <div data-en="link" style="min-height:44px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:500;color:#9B665B;cursor:pointer">Set up my skin profile first</div>
        </div>
      </div>
</div>
<script>
// First-launch entrance. The resting CSS is the finished state, so if this
// never runs the screen simply renders assembled.
var SEEN_KEY = 'manassa-onboarding-seen';
function play() {
  var el = document.getElementById('screen');
  el.classList.remove('intro');
  void el.offsetWidth;              // force reflow so the sequence restarts
  el.classList.add('intro');
}
function replay() { play(); }
(function () {
  var seen = false;
  try { seen = localStorage.getItem(SEEN_KEY) === '1'; } catch (e) {}
  if (seen) return;
  play();
  try { localStorage.setItem(SEEN_KEY, '1'); } catch (e) {}
})();
</script>
</body>
</html>
